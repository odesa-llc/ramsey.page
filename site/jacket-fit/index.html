<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacket fit · Ramsey Hatoum</title>
<meta name="description" content="An interactive fit preview for the cropped faux-leather jacket.">
<link rel="stylesheet" href="fit.css">
<script src="fit.js" defer></script>
</head>
<body>
<!-- MakeHuman-derived mannequin anatomy is licensed CC0. -->
<main id="jacket-fit">
  <header>
    <h1>Cropped faux-leather jacket</h1>
    <p>Current sleeves · Flatter shoulder</p>
  </header>
  <section data-fit-cut="current" aria-label="Current sleeves">
    <div class="fit-stage" aria-label="Drag to rotate the jacket">
      <img src="poster.jpg" alt="Cropped black jacket on a mannequin">
      <canvas class="fit-render" role="img" aria-label="Rotatable view of the cropped jacket"></canvas>
      <div class="fit-overlay" id="current-sleeve-guides" hidden aria-hidden="true"></div>
    </div>
    <div class="fit-controls">
        <div class="fit-control">
          <div class="fit-control-title">
            <label class="form-label" for="sleeve-fit-rotation">Rotation</label>
            <output class="text-small tabular-nums" for="sleeve-fit-rotation">20°</output>
          </div>
          <input class="form-range" type="range" id="sleeve-fit-rotation" min="-180" max="180" step="1" value="20" disabled />
        </div>
        <div class="fit-control">
          <div class="fit-control-title">
            <label class="form-label" for="sleeve-fit-zoom">Zoom</label>
            <output class="text-small tabular-nums" for="sleeve-fit-zoom">75%</output>
          </div>
          <input class="form-range" type="range" id="sleeve-fit-zoom" min="75" max="160" step="1" value="75" disabled />
        </div>
        <div class="fit-control">
          <label class="form-label" for="sleeve-fit-framing">Framing</label>
          <select class="form-select" id="sleeve-fit-framing" disabled>
            <option value="jacket">Jacket</option>
            <option value="zipper">Zipper detail</option>
            <option value="body">Full body</option>
          </select>
        </div>
        <button class="btn" id="sleeve-fit-measure" type="button" aria-pressed="false" aria-controls="current-sleeve-guides" disabled>Show measurements</button>
      </div>
      <p class="fit-note text-small text-muted" hidden>Labels show finished measurements before drape. Sleeve and body widths are measured laid flat.</p>
      <p class="fit-live sr-only" aria-live="polite"></p>
      <p class="fit-unavailable text-small text-muted" hidden>Interactive rotation is unavailable in this viewer.</p>
  </section>
  <template class="fit-guide-template">
    <svg class="fit-lines" viewBox="0 0 400 450" focusable="false">
      <g data-guide="shoulders"><path class="far"/><path/><path/></g>
      <g data-guide="chest"><path class="far"/><path/><path/></g>
      <g data-guide="back"><path class="far"/><path/><path/></g>
      <g data-guide="sleeve"><path class="far"/><path/><path/></g>
      <g data-guide="upper"><path class="far"/><path/><path/></g>
      <g data-guide="cuff"><path class="far"/><path/><path/></g>
      <g data-guide="hem"><path class="far"/><path/><path/></g>
      <g class="fit-side-seams"><path class="side-seam"/><path class="side-seam"/></g>
    </svg>
    <span class="fit-label text-small" data-measure="shoulders">Shoulders 59 cm</span>
    <span class="fit-label text-small" data-measure="chest">Chest 60 cm</span>
    <span class="fit-label text-small" data-measure="back">Back 60 cm</span>
    <span class="fit-label text-small" data-measure="sleeve">Sleeve 62 cm</span>
    <span class="fit-label text-small" data-measure="upper"></span>
    <span class="fit-label text-small" data-measure="cuff"></span>
    <span class="fit-label text-small" data-measure="hem">Hem 60 cm</span>
  </template>
</main>
</body>
</html>
