<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closet — ramsey hatoum</title>

<body>
<style>
  @font-face {
    font-family: 'Notebook Hand';
    src: url('/assets/closet/NotebookHand-Contextual-Regular.woff2?v=1.106') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  #ramsey-closet {
    position: relative;
    isolation: isolate;
    container-type: inline-size;
    color: #222522;
    background: #b3afaa;
    font: 400 1rem/1.25 system-ui, sans-serif;
    text-align: start;
  }

  #ramsey-closet .closet-nav {
    position: absolute;
    z-index: 2;
    inset: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: clamp(.5rem, 4.6vw, 4.75rem);
    min-height: clamp(3.25rem, 6.2vw, 5.1rem);
    padding: .15rem clamp(.625rem, 3.5vw, 2rem);
    background: #f3ede4;
  }

  #ramsey-closet .closet-nav a {
    display: grid;
    align-items: center;
    min-height: 44px;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
  }

  #ramsey-closet .closet-nav a:hover {
    text-decoration: underline;
    text-underline-offset: .26em;
  }

  #ramsey-closet .closet-nav > a:first-child { justify-self: end; }

  #ramsey-closet .closet-signature {
    font: 400 clamp(1.75rem, 3.15vw, 2.65rem)/1 'Notebook Hand', 'Segoe Print', cursive;
    font-synthesis: none;
    font-feature-settings: 'liga' 1, 'calt' 1, 'kern' 1, 'dlig' 1;
  }

  /* Shape the full wordmark in both layers so the original letterforms stay intact. */
  #ramsey-closet .closet-signature { --signature-split: 6.253em; }
  #ramsey-closet .closet-signature > span { grid-area: 1 / 1; }
  #ramsey-closet .closet-signature-base {
    clip-path: inset(-.35em calc(100% - var(--signature-split)) -.35em -.3em);
  }
  #ramsey-closet .closet-signature-final {
    clip-path: inset(-.35em -.3em -.35em var(--signature-split));
    transform: translate(-.061em, .050em);
    user-select: none;
  }

  #ramsey-closet .closet-scene {
    --wall-height: calc(100cqw * 941 / 1671);
    --crawler-width: 32.44cqw;
    --crawler-height: calc(var(--crawler-width) / 2);
    --crawler-rest: calc(var(--wall-height) * .96);
    --crawler-drop: clamp(.875rem, 2cqw, 1.5rem);
    --crawler-clearance: clamp(2rem, 5cqw, 5rem);
    position: relative;
    overflow: hidden;
    background: url('/assets/closet/closet-floor-desktop.webp') center bottom / 100% calc(100% - var(--wall-height)) no-repeat;
  }
  #ramsey-closet .closet-scene:has(> .closet-crawler:not([hidden])) {
    min-height: calc(var(--crawler-rest) + var(--crawler-drop) + var(--crawler-height) + var(--crawler-clearance));
  }
  #ramsey-closet .closet-scene-description {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    margin: 0;
    white-space: nowrap;
  }
  #ramsey-closet .closet-photo {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  #ramsey-closet .closet-crawler {
    position: absolute;
    bottom: var(--crawler-clearance);
    left: calc(50% - var(--crawler-width) / 2);
    width: var(--crawler-width);
    pointer-events: none;
    filter: url(#closet-crawler-floor-shadow);
  }

  #ramsey-closet .closet-crawler-papers,
  #ramsey-closet .closet-crawler-top-strip {
    position: absolute;
    bottom: -.8%;
    left: -8%;
    width: 116%;
    height: 29%;
  }

  #ramsey-closet .closet-crawler-papers,
  #ramsey-closet .closet-crawler-top-strip::before {
    background: var(--crawler-paper-art) center / 100% 100% no-repeat;
  }

  #ramsey-closet .closet-crawler-papers {
    z-index: -1;
    filter: saturate(.76);
  }

  #ramsey-closet .closet-crawler-top-strip {
    z-index: 1;
    filter: saturate(.76) drop-shadow(.3px 1px .8px #3c322a55);
  }

  #ramsey-closet .closet-crawler-top-strip::before {
    content: '';
    position: absolute;
    inset: 0;
    /* Bring the narrow strip back over the curved edge of the older papers. */
    clip-path: polygon(39.4% 77.5%, 89.9% 54%, 91.9% 62.5%, 89.7% 70.7%, 40.2% 91.3%);
  }

  #ramsey-closet .closet-crawler-figure {
    display: block;
    width: 100%;
    height: auto;
    filter: url(#closet-crawler-ground-shadow);
    user-select: none;
  }

  #ramsey-closet .closet-svg-defs { position: absolute; }
  #ramsey-closet .closet-bag-hooks {
    pointer-events: none;
    filter: saturate(.28) contrast(1.12) brightness(1.04) drop-shadow(1px 2px 1px #302d2840);
  }

  #ramsey-closet .closet-hotspots {
    position: absolute;
    inset: 0 0 auto;
    width: 100%;
    height: var(--wall-height);
    pointer-events: none;
    touch-action: pan-y;
  }

  #ramsey-closet .closet-hotspots .closet-hit {
    fill: transparent;
    pointer-events: fill;
    cursor: grab;
    touch-action: pan-y;
  }

  #ramsey-closet .closet-hotspots [data-held] .closet-hit { cursor: grabbing; }

  #ramsey-closet .closet-clasp-chain { filter: saturate(.45); }
  #ramsey-closet .closet-cap-assembly { filter: brightness(1.1) contrast(.96); }
  #ramsey-closet .closet-jacket-art { opacity: .58; }
  #ramsey-closet .closet-jacket-status {
    position: absolute;
    z-index: 1;
    left: 11.85%;
    top: calc(var(--wall-height) * 594 / 941);
    color: #443c35;
    font: 400 .8125rem/1.25 'Notebook Hand', 'Segoe Print', cursive;
    font-feature-settings: 'liga' 1, 'calt' 1, 'kern' 1, 'dlig' 1;
    white-space: nowrap;
    pointer-events: none;
  }

  #ramsey-closet .closet-hotspots a:focus-visible .closet-hit {
    stroke: #fff8ef;
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
    paint-order: stroke fill;
    filter: drop-shadow(0 1px 1px #201e1a);
  }

  #ramsey-closet .closet-hotspots-mobile { display: none; }

  #ramsey-closet .closet-cursor-label {
    position: absolute;
    z-index: 1;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    gap: .45rem;
    padding: .42rem .73rem .45rem;
    border-radius: 999px;
    background: #242622;
    color: #fff9f0;
    box-shadow: 0 2px 8px #18161230;
    font-size: .875rem;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
    text-decoration: none;
  }

  #ramsey-closet .closet-touch-label {
    min-height: 44px;
    box-sizing: border-box;
    pointer-events: auto;
  }

  #ramsey-closet [hidden] { display: none; }
  #ramsey-closet .closet-cursor-status { color: #d7d7cb; }
  #ramsey-closet .closet-cursor-status::before { content: '·'; margin-right: .45rem; }

  #ramsey-closet .closet-detail {
    position: relative;
    display: grid;
    isolation: isolate;
    min-height: max(35rem, 56.3vw);
    background: #b3afaa;
  }

  #ramsey-closet .closet-detail[hidden] { display: none; }

  #ramsey-closet .closet-detail-background,
  #ramsey-closet .closet-detail-layout { grid-area: 1 / 1; }

  #ramsey-closet .closet-detail-background {
    position: relative;
    z-index: -1;
    align-self: start;
    pointer-events: none;
  }

  #ramsey-closet .closet-detail-rail-patch {
    position: absolute;
    inset: 0;
    clip-path: inset(0 4.7%);
    /* Inpaint only the rail. The wall and shelf shadows retain the main crop. */
    mask-image: linear-gradient(transparent 14.8%, black 16.6%, black 22%, transparent 28%);
  }

  #ramsey-closet .closet-detail-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(1.5rem, 5vw, 4.5rem);
    align-items: start;
    width: min(calc(100% - 3rem), 58rem);
    margin-inline: auto;
    padding-block: clamp(6.85rem, 9vw, 9.25rem) 2.25rem;
  }

  #ramsey-closet .closet-detail-copy { padding-top: clamp(.35rem, 1.6vw, 1.4rem); }

  #ramsey-closet .closet-detail-copy h1,
  #ramsey-closet .closet-detail-copy p {
    font-family: 'Notebook Hand', 'Segoe Print', cursive;
    font-weight: 400;
    margin: 0 0 .75rem;
  }

  #ramsey-closet .closet-detail-copy h1 { font-size: clamp(2.45rem, 5.4vw, 4.4rem); }
  #ramsey-closet .closet-detail-copy p { font-size: clamp(1.45rem, 2.7vw, 2rem); }

  #ramsey-closet .pouch-visual {
    position: relative;
    width: min(100%, 24rem);
    margin: 0 auto;
  }

  #ramsey-closet .pouch-pack {
    position: relative;
    z-index: 1;
    filter: drop-shadow(8px 16px 16px #201c1633);
  }

  #ramsey-closet .pouch-photo { display: block; width: 100%; height: auto; }
  #ramsey-closet .pouch-motion { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ramsey-closet .pouch-visual.is-animating .pouch-photo { opacity: 0; }

  #ramsey-closet .pouch-visual[data-paper] .pouch-pack {
    transform: translateX(-7%) rotate(-4deg);
    transform-origin: 66% 82%;
  }

  #ramsey-closet .pouch-visual[data-paper] { width: min(88%, 24rem); }

  #ramsey-closet .closet-pattern-paper {
    position: absolute;
    z-index: 0;
    top: var(--paper-top, -4%);
    left: calc(var(--paper-left, 30%) - var(--paper-inset-adjust, 0%));
    width: var(--paper-width, 88%);
    height: auto;
    transform: rotate(6deg);
    transform-origin: 24% 83%;
    filter: drop-shadow(6px 11px 10px #201c1640);
    pointer-events: none;
  }

  #ramsey-closet [data-paper="open-fold"] {
    --paper-left: 28%;
    --paper-width: 92%;
  }

  #ramsey-closet [data-paper="three-panel-fold"] { --paper-top: -3%; }

  #ramsey-closet [data-paper="cut-paper-template"] {
    --paper-left: 36%;
    --paper-top: -2%;
    --paper-width: 83%;
  }

  @media (max-width: 560px) {
    #ramsey-closet .closet-nav { gap: .6rem; font-size: .875rem; min-height: 3.55rem; }
    #ramsey-closet .closet-signature { font-size: clamp(1.45rem, 7.1vw, 2.12rem); }
    #ramsey-closet .closet-nav > a:first-child { justify-self: start; }
    #ramsey-closet .closet-hotspots-desktop { display: none; }
    #ramsey-closet .closet-hotspots-mobile { display: block; }
    #ramsey-closet .closet-scene {
      --wall-height: calc(100cqw * 1844 / 853);
      --crawler-width: 75.73cqw;
      --crawler-rest: calc(var(--wall-height) - var(--crawler-height));
      --crawler-clearance: 1rem;
      background-image: url('/assets/closet/closet-floor-mobile.png');
    }
    #ramsey-closet .closet-crawler {
      left: 11.23%;
    }
    #ramsey-closet .closet-jacket-status {
      left: max(.5rem, 2.5%);
      top: calc(var(--wall-height) * 916 / 1844);
      font-size: .75rem;
    }
    #ramsey-closet .closet-detail-rail-patch {
      clip-path: none;
      filter: brightness(.976);
      mask-image: linear-gradient(transparent 24%, black 25.2%, black 27.85%, transparent 30.7%);
    }
    #ramsey-closet .closet-detail-layout {
      grid-template-columns: minmax(0, 1fr);
      gap: .85rem;
      padding-top: 5.65rem;
    }
    #ramsey-closet .pouch-visual { width: min(100%, 18rem); }
    #ramsey-closet .pouch-visual[data-paper] {
      --paper-inset-adjust: 7%;
      width: min(86%, 16.5rem);
    }
  }
</style>
