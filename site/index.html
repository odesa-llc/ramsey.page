<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <script src="/i18n-preview.js?v=1"></script><script src="/i18n.js?v=1"></script>
  <script src="/support.js"></script>

  <link rel="stylesheet" href="/typography.css?v=contextual-1.104">

<body class="human-variation v-almost-blank bag-preview-page">
  <a class="skip-link hand" href="#work"><!--i18n:home.mapSkip-->Skip to work<!--/i18n--></a>
  <div id="page">
    <header class="portrait-header">
      <nav class="portrait-navigation" aria-label="Main navigation" data-i18n-aria-label="nav.main">
        <a class="portrait-work hand" href="#work" aria-current="page"><!--i18n:nav.work-->work<!--/i18n--></a>
        <a class="portrait-home" href="/" aria-label="ramsey hatoum home" data-i18n-aria-label="nav.home">
          <span class="portrait-name" aria-hidden="true">ramsey hatoum</span>
          <img class="portrait-face portrait-receipt" src="/assets/home-map/portrait-receipt-balanced-crinkles.png" width="370" height="450" alt="" draggable="false">
        </a>
        <div class="portrait-about-group">
          <a class="portrait-about hand" href="/about/"><!--i18n:nav.about-->about<!--/i18n--></a>
          <a class="portrait-email hand" href="mailto:work@ramsey.page">work@ramsey.page</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="human-hero" aria-labelledby="home-headline">
        <div class="human-hero-copy"><h1 class="hand" id="home-headline" aria-label="physical x digital" data-i18n-aria-label="home.mapHeadline"><!--i18n:home.mapPhysical-->physical<!--/i18n--> <span class="hero-separator" aria-hidden="true">x</span> <!--i18n:home.mapDigital-->digital<!--/i18n--></h1></div>
        <div class="object-shelf" id="work">
          <div id="handbag-making" class="bag-preview-host" aria-label="From pattern papers to finished handbag" data-i18n-aria-label="home.mapMakingLabel">
            <section aria-label="From pattern papers to finished handbag" data-i18n-aria-label="home.mapMakingLabel">
              <div class="bag-demo bag-annotation" data-kind="map">
                <div class="bp-note-diagram">
                  <svg class="bp-pencil-lines" aria-hidden="true" focusable="false"></svg>
                  <h2 class="bp-note-heading"><a href="/handbag/"><!--i18n:home.mapHeading-->faux leather bag<!--/i18n--></a></h2>
                  <div class="bp-notes-row" data-count="3"><button type="button" class="bp-note-piece" data-stage="pattern" aria-pressed="true" aria-label="Read about the pattern papers" data-i18n-aria-label="home.mapPatternRead" data-note="paper guides, held together with little red clips." data-i18n-data-note="home.mapPatternNote">
              <span class="bp-callout"><!--i18n:home.mapPatternFeature-->paper + clips<!--/i18n--></span>
              <span class="bp-art bp-pattern-assembly" data-stage="pattern">
                <img class="bp-pattern-papers" src="/assets/home-map/pattern-papers.webp" alt="Handbag pattern papers with red clips and a black swatch" data-i18n-alt="home.mapPatternAlt" draggable="false">
                <span class="bp-pattern-hardware" role="img" aria-label="Two faux-leather tabs with D-rings and two with clasps and rings" data-i18n-aria-label="home.mapHardwareAlt">
                  <img src="/assets/home-map/hardware/01-leather-ring-left.png" width="1262" height="1246" alt="" draggable="false">
                  <img src="/assets/home-map/hardware/02-leather-ring-right.png" width="1315" height="1196" alt="" draggable="false">
                  <img src="/assets/home-map/hardware/03-leather-clasp-upper.png" width="1733" height="907" alt="" draggable="false">
                  <img src="/assets/home-map/hardware/04-leather-clasp-lower.png" width="1312" height="1199" alt="" draggable="false">
                </span>
              </span>
              <span class="bp-stage-caption"><!--i18n:home.mapPatternLabel-->week 1<!--/i18n--></span>
            </button><button type="button" class="bp-note-piece" data-stage="wip" aria-pressed="false" aria-label="Read about the unfinished handbag" data-i18n-aria-label="home.mapWipRead" data-note="the lining, the seams, and a few unfinished edges." data-i18n-data-note="home.mapWipNote">
              <span class="bp-callout"><!--i18n:home.mapWipFeature-->raw edges<!--/i18n--></span>
              <span class="bp-art" data-stage="wip"><img src="/assets/home-map/wip-handbag.webp" alt="Unfinished cream and black handbag" data-i18n-alt="home.mapWipAlt" draggable="false" class="bp-wip"></span>
              <span class="bp-stage-caption"><!--i18n:home.mapWipLabel-->week 2<!--/i18n--></span>
            </button><button type="button" class="bp-note-piece" data-stage="finished" aria-pressed="false" aria-label="Read about the finished handbag" data-i18n-aria-label="home.mapFinishedRead" data-note="black fabric, silver details, and a bag to take out." data-i18n-data-note="home.mapFinishedNote">
              <span class="bp-callout"><!--i18n:home.mapFinishedFeature-->silver hardware<!--/i18n--></span>
              <span class="bp-art" data-stage="finished"><img src="/assets/home-map/handbag.webp" alt="Finished black handbag with silver hardware" data-i18n-alt="home.mapFinishedAlt" draggable="false"></span>
              <span class="bp-stage-caption"><!--i18n:home.mapFinishedLabel-->week 3<!--/i18n--></span>
            </button></div>
                </div>
                <p class="bp-note-detail" aria-live="polite" aria-atomic="true"><!--i18n:home.mapPatternNote-->paper guides, held together with little red clips.<!--/i18n--></p>
                <div class="bp-note-footer"><button type="button" data-making-next><!--i18n:home.mapNext-->look a little closer →<!--/i18n--></button></div>
              </div>
            </section>
          </div>
          <section class="fuzz-project-group" aria-labelledby="fuzz-project-title">
          <h2 class="fuzz-project-title hand" id="fuzz-project-title"><a href="/fuzz/"><!--i18n:home.mapFuzzHeading-->fuzz circuit<!--/i18n--></a></h2>
          <figure class="loose-object object-diagram">
            <a href="/assets/home-map/fuzz-schematic-transparent.png" target="_blank" rel="noopener" aria-label="Open full-size fuzz circuit diagram" data-i18n-aria-label="home.mapDiagramOpen">
              <img src="/assets/home-map/fuzz-schematic-transparent.png" width="1611" height="976" alt="Grayscale fuzz circuit simulation diagram with component labels" data-i18n-alt="home.mapDiagramAlt" draggable="false" data-widget-cutout="true">
            </a>
          </figure>
          <figure class="loose-object object-board">
            <a href="/fuzz/"><img src="/assets/home-map/breadboard.webp" alt="Breadboard circuit with colorful jumper wires" data-i18n-alt="home.fuzzAlt" draggable="false" data-breadboard-cutout="true"></a>
            <svg class="fuzz-build-arrow" viewBox="0 0 36 22" aria-hidden="true" focusable="false"><path d="M2 15C10 13 19 8 32 10M26 4L33 10L26 17" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <figcaption class="hand"><a href="/fuzz/"><!--i18n:home.mapBoardNote-->breadboard<!--/i18n--></a></figcaption>
          </figure>
          <figure class="loose-object object-prototype">
            <a href="/fuzz/"><img src="/assets/home-map/soldered-prototype-cutout.png?v=top-view-2" width="1536" height="1024" alt="Soldered fuzz circuit on orange perfboard with blue screw terminals" data-i18n-alt="home.mapPrototypeAlt" draggable="false" data-widget-cutout="true"></a>
            <figcaption class="hand"><a href="/fuzz/"><!--i18n:home.mapPrototypeNote-->soldered circuit<!--/i18n--></a></figcaption>
          </figure>
          </section>
          <figure class="loose-object object-camera">
            <a href="/beirut/"><img src="/assets/home-map/camera.webp" alt="Silver Sony digital camera showing a sunlit graffiti wall, with wrist strap" data-i18n-alt="home.cameraAlt" draggable="false" data-widget-cutout="true"></a>
            <figcaption class="hand"><a href="/beirut/"><!--i18n:home.mapCameraNote-->looking around<!--/i18n--></a></figcaption>
          </figure>
        </div>
        <a class="human-scroll hand" href="#more"><!--i18n:home.mapMore-->see more ↓<!--/i18n--></a>
      </section>
    </main>
    <footer class="human-footer" id="more">
      <p class="hand"><!--i18n:home.mapThanks-->thanks for your attention :)<!--/i18n--></p>
    </footer>
  </div>
